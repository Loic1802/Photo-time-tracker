<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#B8CADB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Frames" />
    <title>Frames</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/app-apple-touch-icon.png" />
    <link rel="icon" href="./assets/app-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>

    <!-- ═══════════════════════════════════════
         ONBOARDING — premier lancement uniquement
         ═══════════════════════════════════════ -->
    <section id="onboarding" hidden>

      <!-- Écran 1 — Identité -->
      <div id="ob-screen-1" class="auth-screen">
        <div class="auth-card">
          <div>
            <p class="eyebrow">Bienvenue sur Frames</p>
            <h2>Qui es-tu ?</h2>
          </div>

          <label>
            <span>Prénom</span>
            <input id="ob-prenom" type="text" autocomplete="given-name"
                   placeholder="Ton prénom" required />
          </label>

          <label>
            <span>Spécialité principale</span>
            <select id="ob-specialite">
              <option value="Mariage">Mariage</option>
              <option value="Corporate">Corporate</option>
              <option value="Événement">Événement</option>
              <option value="Packshot">Packshot</option>
              <option value="Éditorial">Éditorial</option>
              <option value="Mixed">Mixed</option>
            </select>
          </label>

          <button class="save-button" id="ob-btn-1" type="button">Continuer</button>
        </div>
      </div>

      <!-- Écran 2 — Objectif financier -->
      <div id="ob-screen-2" class="auth-screen" hidden>
        <div class="auth-card">
          <div>
            <p class="eyebrow">Frames · Objectif</p>
            <h2>Ton taux cible</h2>
          </div>

          <label>
            <span>Revenu mensuel net visé CHF</span>
            <input id="ob-revenu" type="number" min="0" step="100"
                   inputmode="numeric" placeholder="Ex. 5000" required />
          </label>

          <label>
            <span>Jours facturables / mois</span>
            <input id="ob-jours" type="number" min="1" max="25" step="1"
                   inputmode="numeric" value="15" />
          </label>

          <label>
            <span>Charges fixes / mois CHF (optionnel)</span>
            <input id="ob-charges" type="number" min="0" step="50"
                   inputmode="numeric" placeholder="Ex. 800" />
          </label>

          <!-- Prévisualisation taux en temps réel -->
          <div class="hero-metrics">
            <span>
              <em>Minimum</em>
              <strong id="ob-taux-plancher">—</strong>
            </span>
            <span>
              <em>Cible (×1.3)</em>
              <strong id="ob-taux-cible">—</strong>
            </span>
          </div>

          <button class="save-button" id="ob-btn-2" type="button">Continuer</button>
        </div>
      </div>

      <!-- Écran 3 — Prêt -->
      <div id="ob-screen-3" class="auth-screen" hidden>
        <div class="auth-card">
          <div>
            <p class="eyebrow">Frames · Prêt</p>
            <h2>C'est parti !</h2>
          </div>

          <p class="auth-copy">
            Crée ton premier projet pour commencer à tracker ton temps,
            tes frais et calculer ton taux horaire réel.
          </p>

          <button class="save-button" id="ob-btn-3" type="button">
            Créer un projet
          </button>
          <button class="text-button" id="ob-skip" type="button">
            Pas maintenant
          </button>
        </div>
      </div>

    </section>

    <!-- ═══════════════════════════════════════
         APP SHELL — vue principale
         ═══════════════════════════════════════ -->
    <div class="app-shell" id="appShell" hidden>

      <header class="topbar">
        <div class="brand-lockup" aria-label="Frames">
          <img class="brand-mark" src="./assets/app-logo.svg" alt="Frames" />
          <div>
            <p class="eyebrow" id="topbarEyebrow">Frames</p>
            <h1 id="topbarTitle">Studio</h1>
          </div>
        </div>
        <button class="icon-button" id="topbarAction" type="button"
                aria-label="Action principale" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </header>

      <main id="viewContainer"></main>

      <nav class="module-tabs" id="moduleTabs"
           aria-label="Navigation principale"></nav>

    </div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
